name: Bug report
description: Report a reproducible AxiomGuard defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use the private process in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the smallest safe reproduction you can provide.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AxiomGuard version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 24.x
    validations:
      required: true
