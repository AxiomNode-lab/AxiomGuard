name: Feature proposal
description: Propose a focused security primitive or integration.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring security problem should the package solve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed security boundary
      description: Describe what the feature should guarantee, reject, and leave out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing tools or alternatives
      description: Link mature packages or provider guidance that already address this problem.
