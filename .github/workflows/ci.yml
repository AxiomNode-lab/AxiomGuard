name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
        if: matrix.node == 24
      - run: npm pack --dry-run
      - run: npm run scan:self

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run the repository action against itself
        id: axiomguard
        uses: ./
        with:
          path: .
          fail-on-findings: 'true'
      - name: Validate SARIF output
        env:
          SARIF_FILE: ${{ steps.axiomguard.outputs.sarif }}
        run: node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync(process.env.SARIF_FILE,'utf8')); if(x.version!=='2.1.0'||!Array.isArray(x.runs)) process.exit(1)"
