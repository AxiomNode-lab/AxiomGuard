name: Publish container

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/publish-container.yml
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$EVENT_NAME" = "release" ]; then
            node scripts/check-release-tag.mjs
            RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG must point to the current main commit $MAIN_SHA; got $RELEASE_SHA."
              exit 1
            fi
            TAG_VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            MAIN_VERSION="$(git show "$MAIN_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            test "$RELEASE_TAG" = "v$TAG_VERSION" || {
              echo "::error::Release tag $RELEASE_TAG does not match tagged package version $TAG_VERSION."
              exit 1
            }
            test "$TAG_VERSION" = "$MAIN_VERSION" || {
              echo "::error::Tagged package version $TAG_VERSION does not match main package version $MAIN_VERSION."
              exit 1
            }
          else
            CURRENT_SHA="$(git rev-parse HEAD)"
            test "$CURRENT_SHA" = "$MAIN_SHA" || {
              echo "::error::Manual publication must run from the current main branch."
              exit 1
            }
          fi
      - name: Verify published CHANGELOG metadata
        if: github.event_name == 'release'
        run: node scripts/check-published-release.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/axiomnode-lab/axiomguard
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
