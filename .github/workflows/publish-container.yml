name: Publish container

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/publish-container.yml
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$EVENT_NAME" = "release" ]; then
            case "$RELEASE_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::Release tag must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"; exit 1 ;;
            esac
            RELEASE_SHA="$(git rev-list -n1 "refs/tags/$RELEASE_TAG")"
            if ! git merge-base --is-ancestor "$RELEASE_SHA" "$MAIN_SHA"; then
              echo "::error::Release tag does not point to a commit reachable from main."
              exit 1
            fi
            TAG_VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            MAIN_VERSION="$(git show "$MAIN_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            test "$RELEASE_TAG" = "v$TAG_VERSION" || {
              echo "::error::Release tag $RELEASE_TAG does not match tagged package version $TAG_VERSION."
              exit 1
            }
            test "$TAG_VERSION" = "$MAIN_VERSION" || {
              echo "::error::Tagged package version $TAG_VERSION does not match main package version $MAIN_VERSION."
              exit 1
            }
          else
            CURRENT_SHA="$(git rev-parse HEAD)"
            test "$CURRENT_SHA" = "$MAIN_SHA" || {
              echo "::error::Manual publication must run from the current main branch."
              exit 1
            }
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/axiomnode-lab/axiomguard
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
