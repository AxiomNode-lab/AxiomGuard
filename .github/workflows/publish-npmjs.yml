name: Publish npmjs package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$EVENT_NAME" = "release" ]; then
            case "$RELEASE_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::Release tag must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"; exit 1 ;;
            esac
            RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG must point to the current main commit $MAIN_SHA; got $RELEASE_SHA."
              exit 1
            fi
            TAG_VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            MAIN_VERSION="$(git show "$MAIN_SHA:package.json" | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).version)')"
            test "$RELEASE_TAG" = "v$TAG_VERSION" || {
              echo "::error::Release tag $RELEASE_TAG does not match tagged package version $TAG_VERSION."
              exit 1
            }
            test "$TAG_VERSION" = "$MAIN_VERSION" || {
              echo "::error::Tagged package version $TAG_VERSION does not match main package version $MAIN_VERSION."
              exit 1
            }
          else
            CURRENT_SHA="$(git rev-parse HEAD)"
            test "$CURRENT_SHA" = "$MAIN_SHA" || {
              echo "::error::Manual publication must run from the current main branch."
              exit 1
            }
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - name: Check whether this version already exists on npmjs
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          set +e
          npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://registry.npmjs.org >/tmp/axiomguard-view.out 2>/tmp/axiomguard-view.err
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@axiomnode-lab/guard@${VERSION} already exists on npmjs; skipping."
          elif grep -Eqi 'E404|404 Not Found' /tmp/axiomguard-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine npmjs version state; refusing to publish on an ambiguous registry/network failure."
            sed -E 's#(npm_[A-Za-z0-9]+)#[REDACTED]#g' /tmp/axiomguard-view.err >&2
            exit "$STATUS"
          fi
      - name: Publish public package with npm Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --registry=https://registry.npmjs.org --access public
      - name: Verify package version on npmjs
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            ACTUAL="$(npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Verified @axiomnode-lab/guard@${VERSION} on npmjs."
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done
          echo "::error::Published npmjs version ${VERSION} was not readable after retries."
          exit 1
