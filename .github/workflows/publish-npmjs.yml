name: Publish npmjs package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${{ github.event.release.tag_name }}" = "v${VERSION}" || {
            echo "::error::Release tag must be v${VERSION}; got ${{ github.event.release.tag_name }}"
            exit 1
          }
      - name: Check whether this version already exists on npmjs
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          set +e
          npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://registry.npmjs.org >/tmp/axiomguard-view.out 2>/tmp/axiomguard-view.err
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@axiomnode-lab/guard@${VERSION} already exists on npmjs; skipping."
          elif grep -Eqi 'E404|404 Not Found' /tmp/axiomguard-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine npmjs version state; refusing to publish on an ambiguous registry/network failure."
            sed -E 's#(npm_[A-Za-z0-9]+)#[REDACTED]#g' /tmp/axiomguard-view.err >&2
            exit "$STATUS"
          fi
      - name: Publish public package with npm Trusted Publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --registry=https://registry.npmjs.org --access public
      - name: Verify package version on npmjs
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            ACTUAL="$(npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Verified @axiomnode-lab/guard@${VERSION} on npmjs."
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done
          echo "::error::Published npmjs version ${VERSION} was not readable after retries."
          exit 1
