name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - .github/workflows/publish-package.yml
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@axiomnode-lab'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${{ github.event.release.tag_name }}" = "v${VERSION}" || {
            echo "::error::Release tag must be v${VERSION}; got ${{ github.event.release.tag_name }}"
            exit 1
          }
      - name: Check whether this version already exists
        id: version
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Package ${VERSION} already exists; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm publish --ignore-scripts 2>&1 | tee /tmp/axiomguard-publish.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::GitHub Packages publish failed. For a first organization package, verify Organization Settings > Packages > Package creation allows the intended package type/visibility and that this workflow retains packages: write permission."
            exit "$STATUS"
          fi
      - name: Verify package version in GitHub Packages
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            ACTUAL="$(npm view "@axiomnode-lab/guard@${VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)"
            if [ "$ACTUAL" = "$VERSION" ]; then
              echo "Verified @axiomnode-lab/guard@${VERSION} in GitHub Packages."
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done
          echo "::error::Published package version ${VERSION} was not readable back from GitHub Packages after retries."
          exit 1
