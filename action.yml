name: AxiomGuard secret scan

description: Scan a repository for high-confidence secret patterns.

inputs:
  path:
    description: Repository-relative directory to scan. Absolute paths and paths outside GITHUB_WORKSPACE are rejected.
    required: false
    default: .
  fail-on-findings:
    description: Fail the action when new potential secrets are found.
    required: false
    default: 'true'
  config:
    description: Optional repository-relative AxiomGuard config path. Absolute paths and paths outside GITHUB_WORKSPACE are rejected. Defaults to .axiomguard.json in the scan root when present.
    required: false
    default: ''
  baseline:
    description: Optional repository-relative baseline path. Absolute paths and paths outside GITHUB_WORKSPACE are rejected. Defaults to .axiomguard-baseline.json or the config baseline value.
    required: false
    default: ''
  annotations:
    description: Emit GitHub workflow annotations for findings.
    required: false
    default: 'true'

outputs:
  sarif:
    description: Absolute path to the generated SARIF file.
  exit-code:
    description: Scanner exit code before fail-on-findings handling.

runs:
  using: composite
  steps:
    - name: Build AxiomGuard
      shell: bash
      run: |
        set -euo pipefail
        npm --prefix "$GITHUB_ACTION_PATH" ci
        npm --prefix "$GITHUB_ACTION_PATH" run build

    - name: Scan repository
      id: scan
      shell: bash
      env:
        AXIOMGUARD_INPUT_PATH: ${{ inputs.path }}
        AXIOMGUARD_FAIL: ${{ inputs.fail-on-findings }}
        AXIOMGUARD_CONFIG: ${{ inputs.config }}
        AXIOMGUARD_BASELINE: ${{ inputs.baseline }}
        AXIOMGUARD_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        set -euo pipefail
        repo_path() {
          node - "$GITHUB_WORKSPACE" "$1" <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const [rootArg, input] = process.argv.slice(2);
        const root = path.resolve(rootArg);
        const candidate = path.resolve(root, input);
        if (candidate !== root && !candidate.startsWith(root + path.sep)) {
          process.stderr.write('AxiomGuard action paths must stay inside GITHUB_WORKSPACE.\n');
          process.exit(2);
        }
        if (fs.existsSync(candidate)) {
          const resolvedRoot = fs.realpathSync.native(root);
          const resolvedCandidate = fs.realpathSync.native(candidate);
          if (resolvedCandidate !== resolvedRoot && !resolvedCandidate.startsWith(resolvedRoot + path.sep)) {
            process.stderr.write('AxiomGuard action paths must resolve inside GITHUB_WORKSPACE.\n');
            process.exit(2);
          }
        }
        process.stdout.write(candidate);
        NODE
        }
        if [[ -z "$AXIOMGUARD_INPUT_PATH" ]]; then
          echo "::error::path must not be empty"
          exit 2
        fi
        TARGET="$(repo_path "$AXIOMGUARD_INPUT_PATH")"
        SARIF="$RUNNER_TEMP/axiomguard-${GITHUB_RUN_ID:-scan}.sarif"
        ARGS=(scan "$TARGET" --sarif --output "$SARIF")
        if [[ -n "$AXIOMGUARD_CONFIG" ]]; then ARGS+=(--config "$(repo_path "$AXIOMGUARD_CONFIG")"); fi
        if [[ -n "$AXIOMGUARD_BASELINE" ]]; then ARGS+=(--baseline "$(repo_path "$AXIOMGUARD_BASELINE")"); fi
        if [[ "$AXIOMGUARD_ANNOTATIONS" == "true" ]]; then ARGS+=(--github-annotations); fi
        if [[ "$AXIOMGUARD_FAIL" != "true" ]]; then ARGS+=(--no-fail); fi
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${ARGS[@]}"
        STATUS=$?
        set -e
        if [[ -f "$SARIF" ]]; then echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"; else echo "sarif=" >> "$GITHUB_OUTPUT"; fi
        echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"
        if [[ "$STATUS" -eq 2 ]]; then
          echo "AxiomGuard failed to execute." >&2
          exit 2
        fi
        if [[ "$STATUS" -eq 1 ]]; then
          echo "AxiomGuard found one or more new potential secrets." >&2
          exit 1
        fi
