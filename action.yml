name: AxiomGuard Secret Scan
description: Scan a repository for high-confidence secret patterns and produce SARIF without echoing matched values.
author: AxiomNode Lab
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Repository-relative directory to scan.
    required: false
    default: .
  fail-on-findings:
    description: Fail the action when new potential secrets are found.
    required: false
    default: 'true'
  config:
    description: Optional repository-relative AxiomGuard config path. Defaults to .axiomguard.json in the scan root when present.
    required: false
    default: ''
  baseline:
    description: Optional repository-relative baseline path. Defaults to .axiomguard-baseline.json or the config baseline value.
    required: false
    default: ''
  annotations:
    description: Emit GitHub workflow warning annotations for new findings without exposing matched values.
    required: false
    default: 'true'

outputs:
  sarif:
    description: Absolute path to the generated SARIF 2.1.0 file.
    value: ${{ steps.scan.outputs.sarif }}
  exit-code:
    description: AxiomGuard scanner exit code (0 clean, 1 new findings unless fail-on-findings is false, 2 error).
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Build AxiomGuard action runtime
      shell: bash
      run: |
        set -euo pipefail
        npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
        npm --prefix "$GITHUB_ACTION_PATH" run build

    - name: Scan repository
      id: scan
      shell: bash
      env:
        AXIOMGUARD_INPUT_PATH: ${{ inputs.path }}
        AXIOMGUARD_FAIL: ${{ inputs.fail-on-findings }}
        AXIOMGUARD_CONFIG: ${{ inputs.config }}
        AXIOMGUARD_BASELINE: ${{ inputs.baseline }}
        AXIOMGUARD_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        set -euo pipefail
        abs() { if [[ "$1" = /* ]]; then printf '%s' "$1"; else printf '%s/%s' "$GITHUB_WORKSPACE" "$1"; fi; }
        TARGET="$(abs "$AXIOMGUARD_INPUT_PATH")"
        SARIF="$RUNNER_TEMP/axiomguard-${GITHUB_RUN_ID:-scan}.sarif"
        ARGS=(scan "$TARGET" --sarif --output "$SARIF")
        if [[ -n "$AXIOMGUARD_CONFIG" ]]; then ARGS+=(--config "$(abs "$AXIOMGUARD_CONFIG")"); fi
        if [[ -n "$AXIOMGUARD_BASELINE" ]]; then ARGS+=(--baseline "$(abs "$AXIOMGUARD_BASELINE")"); fi
        if [[ "$AXIOMGUARD_ANNOTATIONS" == "true" ]]; then ARGS+=(--github-annotations); fi
        if [[ "$AXIOMGUARD_FAIL" != "true" ]]; then ARGS+=(--no-fail); fi
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${ARGS[@]}"
        STATUS=$?
        set -e
        if [[ -f "$SARIF" ]]; then echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"; else echo "sarif=" >> "$GITHUB_OUTPUT"; fi
        echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"
        if [[ "$STATUS" -eq 2 ]]; then
          echo "AxiomGuard failed to execute." >&2
          exit 2
        fi
        if [[ "$STATUS" -eq 1 ]]; then
          echo "AxiomGuard found one or more new potential secrets." >&2
          exit 1
        fi
